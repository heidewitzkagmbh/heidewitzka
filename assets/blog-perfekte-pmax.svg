<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">PMax: Vom Geschäftsziel zur Umsetzung</title>
<desc id="desc">Drei Ebenen: Wirtschaftlich wertvolle Ergebnisse, gute Daten und Angebote, gezielte Steuerung und Tests.</desc>
<rect width="1200" height="800" fill="#eeece6"/>
<text x="75" y="78" fill="#666" font-family="Helvetica,Arial,sans-serif" font-size="22" letter-spacing="4">HEIDEWITZKA · KAMPAGNENMANAGEMENT</text>
<text x="65" y="256" fill="#111" font-family="Helvetica,Arial,sans-serif" font-size="174" font-weight="700" letter-spacing="-10">PMax.</text>
<text x="78" y="314" fill="#555" font-family="Helvetica,Arial,sans-serif" font-size="32">Die wichtigsten Hebel zuerst.</text>
<rect x="305" y="385" width="590" height="98" rx="16" fill="#111"/>
<text x="600" y="427" text-anchor="middle" fill="#bbb" font-family="Helvetica,Arial,sans-serif" font-size="17" letter-spacing="2">01 · DAS ZIEL</text>
<text x="600" y="459" text-anchor="middle" fill="#fff" font-family="Helvetica,Arial,sans-serif" font-size="29" font-weight="700">Wirtschaftlich wertvolle Ergebnisse</text>
<rect x="205" y="497" width="790" height="98" rx="16" fill="#c9653c"/>
<text x="600" y="539" text-anchor="middle" fill="#fff" font-family="Helvetica,Arial,sans-serif" font-size="17" letter-spacing="2">02 · DIE VORAUSSETZUNGEN</text>
<text x="600" y="571" text-anchor="middle" fill="#fff" font-family="Helvetica,Arial,sans-serif" font-size="29" font-weight="700">Verlässliche Daten · Überzeugendes Angebot</text>
<rect x="105" y="609" width="990" height="98" rx="16" fill="#d9d4c7"/>
<text x="600" y="651" text-anchor="middle" fill="#555" font-family="Helvetica,Arial,sans-serif" font-size="17" letter-spacing="2">03 · DIE UMSETZUNG</text>
<text x="600" y="683" text-anchor="middle" fill="#111" font-family="Helvetica,Arial,sans-serif" font-size="29" font-weight="700">Struktur · Assets · Steuerung · Tests</text>
</svg>
