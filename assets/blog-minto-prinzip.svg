<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Die Antwort zuerst: Das Minto-Prinzip bei Heidewitzka</title><desc id="desc">Eine Kernaussage wird von drei Argumenten getragen. Darunter stehen Belege, Beispiele und Daten.</desc><rect width="1200" height="800" fill="#132341"/><circle cx="1150" cy="30" r="360" fill="#1b3258"/><text x="65" y="77" fill="#a8c9ff" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">DAS MINTO-PRINZIP</text><text x="61" y="179" fill="#fff" font-family="Helvetica,Arial,sans-serif" font-size="87" font-weight="700" letter-spacing="-3">Die Antwort zuerst.</text><text x="65" y="238" fill="#bdcce2" font-family="Helvetica,Arial,sans-serif" font-size="31">So strukturiert Heidewitzka Gedanken und Beiträge.</text><path d="M600 393v17M323 427v-17H877v17M600 410v17M323 510v34M600 510v34M877 510v34" stroke="#8eb9ff" stroke-width="3"/><rect x="365" y="310" width="470" height="83" rx="16" fill="#2b78e4"/><text x="600" y="363" fill="#fff" font-family="Helvetica,Arial,sans-serif" font-size="33" font-weight="700" text-anchor="middle">Eine Kernaussage</text><rect x="193" y="427" width="260" height="83" rx="16" fill="#e5eeff"/><rect x="470" y="427" width="260" height="83" rx="16" fill="#e5eeff"/><rect x="747" y="427" width="260" height="83" rx="16" fill="#e5eeff"/><text x="323" y="479" fill="#173c72" font-family="Helvetica,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle">Argument 1</text><text x="600" y="479" fill="#173c72" font-family="Helvetica,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle">Argument 2</text><text x="877" y="479" fill="#173c72" font-family="Helvetica,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle">Argument 3</text><rect x="90" y="544" width="1020" height="104" rx="16" fill="#fff"/><text x="600" y="607" fill="#173c72" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle">Belege, Beispiele und Daten</text><text x="65" y="750" fill="#fff" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700">.heidewitzka</text><text x="1135" y="750" fill="#bdcce2" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="end">Klar denken. Nachvollziehbar erklären.</text></svg>