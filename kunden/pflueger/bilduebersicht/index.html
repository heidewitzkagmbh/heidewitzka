(async()=>{const bytes=Uint8Array.from(atob(document.querySelector('#data').textContent),c=>c.charCodeAt(0));const items=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).json();const el=id=>document.getElementById(id);let matches=[],limit;const norm=s=>s.toLocaleLowerCase('de').replaceAll('ß','ss').replaceAll('ü','ue').replaceAll('ö','oe').replaceAll('ä','ae');
function draw(){for(const r of matches.slice(grid.children.length,limit)){const card=document.createElement('article');card.innerHTML='<a target="_blank" rel="noopener"><img loading="lazy"></a><p><small></small></p><h2></h2><p class="caption"></p><a class="source" target="_blank" rel="noopener">Zur Pflüger-Seite ↗</a>';const img=card.querySelector('img');img.src=r[6];img.alt=r[4]||r[2];card.firstChild.href=r[6];card.querySelector('small').textContent=r[1]+' · '+r[3];card.querySelector('h2').textContent=r[2];card.querySelector('.caption').textContent=r[4];card.querySelector('.source').href=r[5];grid.append(card)}el('more').hidden=limit>=matches.length}
const grid=el('grid');function filter(){matches=items.filter(r=>(!el('area').value||r[0]===el('area').value)&&r[1].includes(el('topic').value)&&norm(r.slice(0,5).join(' ')).includes(norm(el('q').value.trim())));limit=48;grid.replaceChildren();el('count').textContent=matches.length+' von '+items.length+' Bildern';draw()}document.querySelector('form').oninput=filter;el('more').onclick=()=>{limit+=48;draw()};filter()})().catch(()=>document.getElementById('count').textContent='Bitte öffne die Übersicht in einem aktuellen Browser.');</script></html>
